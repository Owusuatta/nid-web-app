<!DOCTYPE html>
<html>
<head>
    <title>Edit Citizen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Edit Citizen Info</h2>
        <form method="POST">
            <label>Full Name:</label>
            <input type="text" name="full_name" value="{{ citizen[0] }}" required><br>
            <label>Date of Birth:</label>
            <input type="text" name="dob" value="{{ citizen[1] }}" required><br>
            <label>Gender:</label>
            <input type="text" name="gender" value="{{ citizen[2] }}" required><br>
            <label>Address:</label>
            <input type="text" name="address" value="{{ citizen[3] }}" required><br>
            <button type="submit">Update</button>
        </form>
        <br>
        <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    </div>
</body>
</html>
